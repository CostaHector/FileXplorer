<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>密码本</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
       background:#f5f6f8;color:#222}
  header{background:#1f2937;color:#fff;padding:12px 16px;display:flex;gap:10px;
         align-items:center;flex-wrap:wrap;position:sticky;top:0;z-index:10}
  header h1{margin:0;font-size:18px;font-weight:600;flex:0 0 auto}

  .key-wrap{position:relative;display:flex;align-items:center;flex:0 0 auto}
  .key-wrap input#aes-key{
    min-width:200px;padding:8px 38px 8px 12px;border-radius:8px;border:none;
    font-size:14px;outline:none;
    font-family:ui-monospace,Menlo,Consolas,monospace}
  .eye-btn{position:absolute;right:4px;top:50%;transform:translateY(-50%);
           width:30px;height:30px;display:flex;align-items:center;justify-content:center;
           background:none;border:none;border-radius:6px;cursor:pointer;
           color:#6b7280;padding:0}
  .eye-btn:hover{color:#1f2937;background:rgba(0,0,0,.06)}
  .eye-btn:active{transform:translateY(-50%) scale(.94)}
  .eye-btn .icon-eye-off{display:none}
  .eye-btn.visible .icon-eye{display:none}
  .eye-btn.visible .icon-eye-off{display:block}

  header input#q{flex:1;min-width:160px;padding:8px 12px;border-radius:8px;border:none;
                 font-size:14px;outline:none}
  header button.hbtn{padding:8px 14px;border-radius:8px;border:none;cursor:pointer;
                     font-size:14px;font-weight:600;background:#4f46e5;color:#fff}
  header button.hbtn.green{background:#059669}
  header button.hbtn:active{transform:scale(.97)}

  .grid{display:grid;gap:14px;padding:16px;
        grid-template-columns:repeat(auto-fill,minmax(320px,1fr));
        max-width:1400px;margin:0 auto}

  .card{position:relative;background:#fff;border-radius:12px;
        box-shadow:0 1px 4px rgba(0,0,0,.06);padding:16px;
        display:flex;flex-direction:column;gap:10px;
        transition:box-shadow .15s, opacity .15s}
  .card.pending{box-shadow:0 0 0 2px #fbbf24, 0 1px 4px rgba(0,0,0,.06)}
  .card.deleted{opacity:.82}

  /* 删除标记：两条红色对角线覆盖整张卡片 */
  .delete-x{position:absolute;inset:0;pointer-events:none;display:none;z-index:5;
            border-radius:12px;overflow:hidden}
  .card.deleted .delete-x{display:block}
  .delete-x svg{width:100%;height:100%;display:block}

  .del-btn,.restore-btn{position:absolute;top:8px;right:8px;width:26px;height:26px;
                         border-radius:50%;border:none;cursor:pointer;font-weight:700;
                         font-size:16px;line-height:1;display:flex;
                         align-items:center;justify-content:center;z-index:6}
  .del-btn{background:#fee2e2;color:#b91c1c}
  .restore-btn{background:#d1fae5;color:#065f46;font-size:15px;display:none}
  .card.deleted .del-btn{display:none}
  .card.deleted .restore-btn{display:flex}
  .del-btn:active,.restore-btn:active{transform:scale(.94)}

  input.type-input,input.name-input,input.field-input,textarea.others{
    width:100%;border:1px solid #e5e7eb;border-radius:6px;padding:7px 10px;
    font-size:14px;background:#fafafa;color:#111;outline:none;
    transition:border-color .15s,background .15s;font-family:inherit}
  input.type-input:focus,input.name-input:focus,input.field-input:focus,textarea.others:focus{
    border-color:#6366f1;background:#fff}
  input.type-input{font-size:12px;padding:4px 10px;max-width:160px;color:#3730a3}
  input.name-input{font-size:16px;font-weight:600}
  input.pwd{font-family:ui-monospace,Menlo,Consolas,monospace}

  /* 已删除卡片的输入框禁用外观 */
  .card.deleted input,
  .card.deleted textarea{color:#9ca3af;cursor:not-allowed}

  textarea.others{
    font-size:13px;line-height:1.55;padding:8px 10px;
    min-height:calc(13px * 1.55 * 1 + 16px);
    max-height:280px;resize:vertical;
    white-space:pre-wrap;word-break:break-all;
  }
  textarea.others.expanded{
    height:calc(13px * 1.55 * 7 + 16px);max-height:none;
  }

  .row{display:flex;flex-direction:column;gap:4px}
  .row .k{color:#6b7280;font-size:12px}
  .row .v{display:flex;gap:8px;align-items:center}
  .row .v input{flex:1;min-width:0}

  .row-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .expand-btn{background:none;border:1px solid #e5e7eb;color:#6b7280;
              font-size:11px;padding:2px 10px;border-radius:6px;cursor:pointer;
              line-height:1.4}
  .expand-btn:hover{color:#3730a3;border-color:#c7d2fe;background:#eef2ff}
  .expand-btn:active{transform:scale(.97)}

  .copy{flex:0 0 auto;background:#eef2ff;color:#3730a3;border:none;border-radius:6px;
        padding:5px 12px;font-size:12px;cursor:pointer}
  .copy:active{transform:scale(.97)}

  .actions{display:flex;gap:8px;margin-top:4px;padding-top:8px;
           border-top:1px dashed #e5e7eb}
  .actions button{flex:1;padding:8px 12px;border-radius:8px;border:none;
                  cursor:pointer;font-size:13px;font-weight:600}
  .actions .save-btn{background:#059669;color:#fff}
  .actions .undo-btn{background:#e5e7eb;color:#374151}
  .actions button:active{transform:scale(.97)}

  .empty{padding:40px;text-align:center;color:#9ca3af;grid-column:1/-1}
</style>
</head>
<body>
<header>
  <h1>密码本</h1>

<div class="key-wrap">
  <input id="aes-key" type="password" placeholder="AES 密钥" autocomplete="off" enterkeyhint="go">
  <button id="toggle-key" type="button" class="eye-btn" title="显示密钥" aria-label="显示密钥">
    <svg class="icon-eye" viewBox="0 0 24 24" width="18" height="18"
         fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
      <circle cx="12" cy="12" r="3"/>
    </svg>
    <svg class="icon-eye-off" viewBox="0 0 24 24" width="18" height="18"
         fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
      <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
      <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/>
      <line x1="1" y1="1" x2="23" y2="23"/>
    </svg>
  </button>
</div>
<button id="btn-setkey" type="button" class="hbtn" title="用当前密钥载入密码本">载入</button>

  <input id="q" placeholder="搜索 type / name / account / pwd / others">
  <button id="btn-add"  class="hbtn"       title="新增一条">+</button>
  <button id="btn-commit" class="hbtn green" title="写入磁盘">Commit</button>
</header>
<div id="grid" class="grid"></div>

<script>
/* ---------------- 数据结构 ----------------
 * g_allAccounts   : 最近一次与 C++ 内存同步的快照（含 isDeleted 记录）
 * g_working       : 前端工作副本（含 isDeleted 记录）
 * g_pendingCommit : 需要落盘的 id 集合（C++ 内存 vs 磁盘不一致）
 *
 * 三层状态（与 git 对齐）：
 *   用户输入未 Stage  → hasLocalEdit=true,  pending=false
 *   已 Stage          → hasLocalEdit=false, pending=true
 *   已 Commit          → hasLocalEdit=false, pending=false
 */
let g_allAccounts   = [];
let g_working       = [];
let g_pendingCommit = new Set();


/* ---------------- 不同设备访问时, 必须用正确的 token ---------------- */
const grid = document.getElementById('grid');
const TOKEN_KEY = 'pwdbook_token';
function getToken()  { return localStorage.getItem(TOKEN_KEY) || ''; }
function setToken(t) { localStorage.setItem(TOKEN_KEY, t); }
function clearToken(){ localStorage.removeItem(TOKEN_KEY); }
function showNeedKey(msg){
  grid.innerHTML = `<div class="empty">${esc(msg)}</div>`;
}

async function authFetch(url, opts = {}) {
  const token = getToken();
  const headers = { ...(opts.headers || {}) };
  if (token) headers['Authorization'] = `Bearer ${token}`;
  const r = await fetch(url, { ...opts, headers });
  if (r.status === 401) {
    const hadToken = !!token;
    clearToken();
    setKeyInputLocked(false);
    showNeedKey(hadToken ? '会话已失效，请重新输入 AES 密钥' : '请输入 AES 密钥以加载密码本');
    throw new Error('unauthorized');
  }
  return r;
}


/* ---------------- 工具 ---------------- */
function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g,c=>({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function deepClone(o){ return JSON.parse(JSON.stringify(o)); }
function findById(arr,id){ return arr.find(a=>a.id===id); }

function hasLocalEdit(entry){
  const orig = findById(g_allAccounts, entry.id);
  if (!orig) return true;
  return orig.type    !== entry.type
      || orig.name    !== entry.name
      || orig.account !== entry.account
      || orig.pwd     !== entry.pwd
      || orig.others  !== entry.others;
}
function isPendingCommit(entry){ return g_pendingCommit.has(entry.id); }

/* 统一刷新单张卡片的按钮组与 pending 高亮（删除态不显示这两个） */
function refreshCardState(card, entry){
  if (!card || !entry) return;
  const actions = card.querySelector('.actions');
  const showActions = !entry.isDeleted && hasLocalEdit(entry);
  if (actions) actions.style.display = showActions ? '' : 'none';
  card.classList.toggle('pending', !entry.isDeleted && isPendingCommit(entry));
}

/* 根据 isDeleted 应用卡片视觉状态（class、输入框禁用、按钮可见性） */
function applyDeletedState(card, entry){
  if (!card || !entry) return;
  const deleted = !!entry.isDeleted;
  card.classList.toggle('deleted', deleted);
  card.querySelectorAll('input,textarea').forEach(el => { el.disabled = deleted; });
  if (deleted) {
    card.classList.remove('pending');
    const actions = card.querySelector('.actions');
    if (actions) actions.style.display = 'none';
  } else {
    refreshCardState(card, entry);
  }
}

/* ---------------- 渲染 ---------------- */
function cardHtml(a){
  const cls = ['card'];
  if (a.isDeleted) cls.push('deleted');
  else if (isPendingCommit(a)) cls.push('pending');
  const showActions = (!a.isDeleted && hasLocalEdit(a)) ? '' : 'style="display:none"';
  const dis = a.isDeleted ? 'disabled' : '';

  return `<div class="${cls.join(' ')}" data-id="${a.id}">
    <div class="delete-x" aria-hidden="true">
      <svg preserveAspectRatio="none" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <line x1="0" y1="0" x2="100" y2="100" stroke="#dc2626" stroke-width="2"
              vector-effect="non-scaling-stroke"/>
        <line x1="100" y1="0" x2="0" y2="100" stroke="#dc2626" stroke-width="2"
              vector-effect="non-scaling-stroke"/>
      </svg>
    </div>
    <button class="del-btn" title="标记删除">×</button>
    <button class="restore-btn" title="恢复">↺</button>

    <input class="type-input" data-field="type" value="${esc(a.type)}" placeholder="类型" ${dis}>
    <input class="name-input" data-field="name" value="${esc(a.name)}" placeholder="用户名" ${dis}>

    <div class="row"><span class="k">账户</span>
      <div class="v">
        <input class="field-input" data-field="account" value="${esc(a.account)}" placeholder="账户" ${dis}>
        <button class="copy" data-field="account">复制</button>
      </div>
    </div>

    <div class="row"><span class="k">密钥</span>
      <div class="v">
        <input class="field-input pwd" data-field="pwd" value="${esc(a.pwd)}" placeholder="密码" ${dis}>
        <button class="copy" data-field="pwd">复制</button>
      </div>
    </div>

    <div class="row">
      <div class="row-head">
        <span class="k">其他</span>
        <button class="expand-btn" title="展开/收起">展开</button>
      </div>
      <textarea class="others" data-field="others" rows="2"
                placeholder="其他内容" ${dis}>${esc(a.others)}</textarea>
    </div>

    <div class="actions" ${showActions}>
      <button class="save-btn">Stage 暂存</button>
      <button class="undo-btn">撤销修改</button>
    </div>
  </div>`;
}

function render(){
  const q = document.getElementById('q').value.trim().toLowerCase();
  const list = !q ? g_working : g_working.filter(a =>
    [a.type, a.name, a.account, a.pwd, a.others]
      .some(v => String(v||'').toLowerCase().includes(q)));

  if (!list.length){
    grid.innerHTML = '<div class="empty">没有匹配项</div>';
    return;
  }
  grid.innerHTML = list.map(a => cardHtml(a)).join('');
}

/* ---------------- 事件：输入 ---------------- */
grid.addEventListener('input', e => {
  const el = e.target;
  if (!el.dataset || !el.dataset.field) return;
  const card = el.closest('.card');
  if (!card) return;
  const id    = +card.dataset.id;
  const field = el.dataset.field;
  const entry = findById(g_working, id);
  if (!entry || entry.isDeleted) return;   // 已删除不可编辑

  entry[field] = el.value;
  // 只改 UI，C++ 内存未变 → 不 add 到 pending，等 Stage 成功再 add
  refreshCardState(card, entry);
});

/* ---------------- 事件：点击（委托） ---------------- */
grid.addEventListener('click', async e => {
  const expandBtn = e.target.closest('.expand-btn');
  if (expandBtn){
    const card = expandBtn.closest('.card');
    const ta   = card && card.querySelector('textarea[data-field="others"]');
    if (ta){
      const expanded = ta.classList.toggle('expanded');
      expandBtn.textContent = expanded ? '收起' : '展开';
      if (expanded){
        requestAnimationFrame(() =>
          ta.scrollIntoView({behavior:'smooth', block:'nearest'}));
      }
    }
    return;
  }

  const stageBtn = e.target.closest('.save-btn');
  if (stageBtn){ await onStageCard(stageBtn.closest('.card')); return; }

  const undoBtn = e.target.closest('.undo-btn');
  if (undoBtn){ onUndoCard(undoBtn.closest('.card')); return; }

  const delBtn  = e.target.closest('.del-btn');
  if (delBtn){ await onDeleteCard(delBtn.closest('.card')); return; }

  const restoreBtn = e.target.closest('.restore-btn');
  if (restoreBtn){ await onRestoreCard(restoreBtn.closest('.card')); return; }

  const copyBtn = e.target.closest('.copy');
  if (copyBtn){ onCopyField(copyBtn); return; }
});

/* ---------------- 密钥框：显示/隐藏 ---------------- */
const keyInput  = document.getElementById('aes-key');
const toggleKey = document.getElementById('toggle-key');
const btnSetKey = document.getElementById('btn-setkey');


toggleKey.addEventListener('click', () => {
  const nowVisible = keyInput.type === 'password';
  keyInput.type = nowVisible ? 'text' : 'password';
  toggleKey.classList.toggle('visible', nowVisible);
  toggleKey.title = nowVisible ? '隐藏密钥' : '显示密钥';
  toggleKey.setAttribute('aria-label', toggleKey.title);
  keyInput.focus();
  try {
    const len = keyInput.value.length;
    keyInput.setSelectionRange(len, len);
  } catch (_) {}
});

/* ---------------- 密钥提交 ---------------- */
async function submitAesKey(){
  const key = keyInput.value.trim();
  if (!key) { alert('请输入密钥'); keyInput.focus(); return; }

  const originalText = btnSetKey.textContent;
  btnSetKey.disabled = true;
  btnSetKey.textContent = '载入中...';

  try{
    const r = await fetch('/api/setkey', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({key}),
    });
    const j = await r.json();
    if (!j.ok){
      alert('密钥无效或文件损坏: ' + (j.error || '未知错误'));
      return;
    }
    if (j.token) setToken(j.token);
    await load();
  } catch(err){
    alert('设置密钥失败: ' + err.message);
  } finally {
    btnSetKey.disabled = false;
    btnSetKey.textContent = originalText;
  }
}

// 桌面端：回车仍然可用
keyInput.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  e.preventDefault();
  submitAesKey();
});

// 手机端 / 桌面端：点击按钮
btnSetKey.addEventListener('click', submitAesKey);

/* ---------------- Stage 暂存单个卡片 ---------------- */
async function onStageCard(card){
  if (!card) return;
  const id    = +card.dataset.id;
  const entry = findById(g_working, id);
  if (!entry || entry.isDeleted) return;

  const body = {
    id, type: entry.type, name: entry.name,
    account: entry.account, pwd: entry.pwd, others: entry.others,
  };
  try{
    const r = await authFetch('/api/update', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify(body),
    });
    const j = await r.json();
    if (!j.ok){ alert('暂存失败: ' + (j.error || '未知错误')); return; }

    const orig = findById(g_allAccounts, id);
    if (orig){
      Object.assign(orig, {
        type: entry.type, name: entry.name, account: entry.account,
        pwd: entry.pwd, others: entry.others,
      });
    } else {
      g_allAccounts.push(deepClone(entry));
    }

    // 内存已变、磁盘未变 → 待落盘
    g_pendingCommit.add(id);
    refreshCardState(card, entry);
  } catch(err){
    alert('暂存失败: ' + err.message);
  }
}

/* ---------------- 撤销本地修改 ---------------- */
function onUndoCard(card){
  if (!card) return;
  const id    = +card.dataset.id;
  const orig  = findById(g_allAccounts, id);
  const entry = findById(g_working, id);
  if (!orig || !entry || entry.isDeleted) return;

  Object.assign(entry, {
    type: orig.type, name: orig.name, account: orig.account,
    pwd: orig.pwd, others: orig.others,
  });

  card.querySelector('[data-field="type"]').value    = entry.type;
  card.querySelector('[data-field="name"]').value    = entry.name;
  card.querySelector('[data-field="account"]').value = entry.account;
  card.querySelector('[data-field="pwd"]').value     = entry.pwd;
  card.querySelector('[data-field="others"]').value  = entry.others;

  // 撤销只恢复 UI 到内存基线；pending 不变（由是否 Stage 过决定）
  refreshCardState(card, entry);
}

/* ---------------- 删除（标记 isDeleted=true） ---------------- */
async function onDeleteCard(card){
  if (!card) return;
  const id    = +card.dataset.id;
  const entry = findById(g_working, id);
  if (!entry || entry.isDeleted) return;

  try{
    const r = await authFetch('/api/delete', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({id}),
    });
    const j = await r.json();
    if (!j.ok){ alert('删除失败: ' + (j.error || '未知错误')); return; }

    entry.isDeleted = true;
    const orig = findById(g_allAccounts, id);
    if (orig) orig.isDeleted = true;
    g_pendingCommit.add(id);       // 删除是内存修改，需要落盘
    applyDeletedState(card, entry);
  } catch(err){
    alert('删除失败: ' + err.message);
  }
}

/* ---------------- 恢复（取消 isDeleted 标记） ---------------- */
async function onRestoreCard(card){
  if (!card) return;
  const id    = +card.dataset.id;
  const entry = findById(g_working, id);
  if (!entry || !entry.isDeleted) return;

  try{
    const r = await authFetch('/api/restore', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({id}),
    });
    const j = await r.json();
    if (!j.ok){ alert('恢复失败: ' + (j.error || '未知错误')); return; }

    entry.isDeleted = false;
    const orig = findById(g_allAccounts, id);
    if (orig) orig.isDeleted = false;
    g_pendingCommit.add(id);       // 恢复也是内存修改，需要落盘
    applyDeletedState(card, entry);
  } catch(err){
    alert('恢复失败: ' + err.message);
  }
}

/* ---------------- 复制 ---------------- */
function onCopyField(btn){
  const card  = btn.closest('.card');
  if (!card) return;
  const id    = +card.dataset.id;
  const field = btn.dataset.field;
  const entry = findById(g_working, id);
  if (!entry) return;
  copyText(String(entry[field] || ''), btn);
}

function copyText(text, btn){
  const done = () => { const t=btn.textContent; btn.textContent='已复制';
                       setTimeout(()=>btn.textContent=t, 800); };
  if (navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(text).then(done).catch(()=>fallback(text, done));
  } else {
    fallback(text, done);
  }
}
function fallback(text, done){
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position='fixed'; ta.style.top='-1000px';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); done(); } catch(_) {}
  document.body.removeChild(ta);
}

/* ---------------- 搜索 ---------------- */
document.getElementById('q').addEventListener('input', render);

/* ---------------- header：新增 ---------------- */
document.getElementById('btn-add').addEventListener('click', async () => {
  try{
    const r = await authFetch('/api/add', {
      method:'POST', headers:{'Content-Type':'application/json'}, body:'{}',
    });
    const j = await r.json();
    if (!j.ok){ alert('添加失败'); return; }

    const newEntry = {
      id: j.id, type:'', name:'', account:'', pwd:'', others:'',
      isModified:false, isDeleted:false,
    };
    g_working.push(newEntry);
    g_allAccounts.push(deepClone(newEntry));
    g_pendingCommit.add(j.id);      // 新记录磁盘上不存在，必然需要落盘

    document.getElementById('q').value = '';
    if (grid.querySelector('.empty')) grid.innerHTML = '';
    grid.insertAdjacentHTML('beforeend', cardHtml(newEntry));

    requestAnimationFrame(() => {
      window.scrollTo({top: document.body.scrollHeight, behavior:'smooth'});
      const cards = grid.querySelectorAll('.card');
      const last  = cards[cards.length-1];
      if (last){
        last.scrollIntoView({behavior:'smooth', block:'center'});
        const inp = last.querySelector('input,textarea');
        if (inp) inp.focus();
      }
    });
  } catch(err){
    alert('添加失败: ' + err.message);
  }
});

/* ---------------- header：Commit ---------------- */
document.getElementById('btn-commit').addEventListener('click', async () => {
  // 有未 Stage 的本地修改时，要求用户先手动 Stage
  const unstaged = g_working.filter(a => !a.isDeleted && hasLocalEdit(a));
  if (unstaged.length > 0){
    alert(`有 ${unstaged.length} 条修改尚未暂存（Stage），请先逐条点击「Stage 暂存」或「撤销修改」后再来 Commit。`);
    return;
  }

  try{
    const r = await authFetch('/api/commit', {
      method:'POST', headers:{'Content-Type':'application/json'}, body:'{}',
    });
    const j = await r.json();
    if (!j.ok){ alert('写入磁盘失败: ' + (j.error || '未知错误')); return; }

    g_pendingCommit.clear();
    document.querySelectorAll('.card').forEach(card => {
      const entry = findById(g_working, +card.dataset.id);
      if (entry) refreshCardState(card, entry);
    });
    alert('已保存到磁盘');
  } catch(err){
    alert('写入磁盘失败: ' + err.message);
  }
});

/* ---------------- 加载 ---------------- */
function setKeyInputLocked(locked) {
  keyInput.disabled = locked;
  btnSetKey.disabled = locked;
  toggleKey.disabled = locked;
  keyInput.placeholder = locked ? '已使用当前密钥载入' : 'AES 密钥';
  // 可选：把输入框内容清掉，不让用户再看到
  if (locked) keyInput.value = '';
}

async function load() {
  try{
    const r = await authFetch('/api/accounts', {cache:'no-store'});
    const j = await r.json();
    const raw = j.accounts || [];

    g_allAccounts   = raw;                       // 保留 isDeleted 记录
    g_working       = deepClone(g_allAccounts);
    g_pendingCommit = new Set(
      g_allAccounts.filter(a => a.isModified || a.isDeleted).map(a => a.id)
    );

    if (g_working.length === 0) {
      grid.innerHTML = '<div class="empty">请输入 AES 密钥后回车加载账户</div>';
      return;
    }
    setKeyInputLocked(true);
    render();
  } catch(err) {
    if (err.message === 'unauthorized') {
      setKeyInputLocked(false);
      return;   // authFetch 已显示提示
    }
    g_allAccounts = [
      {"id":0,"type":"E-mail","name":"X@gmail.com","account":"123","pwd":"pwd here: 91051","others":"others","isModified":false,"isDeleted":false},
      {"id":1,"type":"Social Media","name":"FaceBook","account":"123","pwd":"pwd here: abcsaas","others":"others","isModified":false,"isDeleted":false},
      {"id":2,"type":"Bank Account","name":"HSBC random","account":"123","pwd":"pwd here: abc2xc0dfv","others":"others","isModified":false,"isDeleted":false},
      {"id":3,"type":"Game&Entertainment","name":"Minecraft Java","account":"123","pwd":"pwd here: sa140abc","others":"others","isModified":false,"isDeleted":false},
      {"id":4,"type":"Tools","name":"Qt community","account":"123","pwd":"pwd here: xyz","others":"others longs description","isModified":false,"isDeleted":false},
    ];
    g_working       = deepClone(g_allAccounts);
    g_pendingCommit = new Set();
    render();
    console.warn('加载失败，使用默认数据', err);
  }
}
load();
